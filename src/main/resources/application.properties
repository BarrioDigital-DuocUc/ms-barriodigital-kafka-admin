# Aplicacion
spring.application.name=ms-barriodigital-kafka-admin

# Servidor REST - solo equipo local
server.port=${SERVER_PORT:8087}
server.address=127.0.0.1

# Kafka - 3 brokers locales
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

# Administracion Kafka
barriodigital.kafka-admin.write-enabled=false

# Tiempo maximo de operaciones administrativas
barriodigital.kafka-admin.timeout-seconds=10